version: '3.9'

services:
  # Spring Boot 后端
  marketing-person-center:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing-person-center
    ports:
      - "30000:30000"
    environment:
      - PORT=30000
      - JAVA_OPTS=-Xms512m -Xmx1g
      - NACOS_ADDR=${NACOS_ADDR:-mse-1963d6e0-nacos-ans.mse.aliyuncs.com:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-0cd0fad7-79bd-4b8c-9bb2-dbaa7f8393aa}
      - ENVIRONMENT=${ENVIRONMENT:-fat}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - beukay-net

networks:
  beukay-net:
    driver: bridge

# Hermes Agent OS 在宿主机运行，不进容器。
# 本地开发使用: make dev
